[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-nsrl"
version = "0.1.0"
description = "Finite-trace temporal-logic reward machines for PyQuaticus PPO"
requires-python = ">=3.10,<3.11"
dependencies = ["stable-baselines3==2.7.0", "numpy<2", "lark==1.3.1", "requests>=2.32", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mctf = "maritime_nsrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

