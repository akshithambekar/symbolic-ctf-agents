[project]
name = "symbolic-ctf-demos"
version = "0.1.0"
description = "Sample-agent demonstrations for maritime capture the flag"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = ["pyquaticus", "numpy<2", "pygame==2.4.0"]

[tool.uv]
package = false
# This demo uses the bundled observation-based policies, which need no MOOS bridge.
exclude-dependencies = ["pymoos"]
constraint-dependencies = [
    "scipy==1.14.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
pyquaticus = { git = "https://github.com/mit-ll-trusted-autonomy/pyquaticus.git", rev = "475d670650ec5d49691ba707cd1054c4e45d8053" }
