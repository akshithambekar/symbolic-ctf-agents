[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-nsrl"
version = "0.1.0"
description = "Temporal-logic guidance for PyQuaticus PPO"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyquaticus",
    "stable-baselines3==2.7.0",
    "numpy<2",
    "pygame==2.4.0",
    "lark==1.3.1",
    "requests>=2.32",
    "matplotlib>=3.7",
]

[project.scripts]
mctf = "maritime_nsrl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Simulation does not use the native MOOS hardware bridge.
exclude-dependencies = ["pymoos"]
constraint-dependencies = [
    "scipy==1.14.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
pyquaticus = { git = "https://github.com/mit-ll-trusted-autonomy/pyquaticus.git", rev = "475d670650ec5d49691ba707cd1054c4e45d8053" }
